<svg xmlns="http://www.w3.org/2000/svg" width="240" height="480" viewBox="0 0 240 480" fill="none">
  <title>Device restriction settings</title>
  <desc>A tall phone with a slim metal frame, rounded display, camera cutout, side buttons and home indicator. Camera is allowed; AirDrop and in-app purchases are restricted.</desc>
  <defs>
    <linearGradient id="frame" x1="23" y1="12" x2="218" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#a7ada4"/><stop offset=".18" stop-color="#e2e4dc"/><stop offset=".52" stop-color="#727e73"/><stop offset=".8" stop-color="#c5ccc0"/><stop offset="1" stop-color="#667466"/></linearGradient>
    <linearGradient id="glass" x1="31" y1="28" x2="204" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#fafbf8"/><stop offset="1" stop-color="#eef1eb"/></linearGradient>
    <filter id="shadow" x="0" y="0" width="240" height="480" filterUnits="userSpaceOnUse"><feDropShadow dx="5" dy="9" stdDeviation="6" flood-color="#243b2b" flood-opacity=".19"/></filter>
    <clipPath id="screen"><rect x="31" y="25" width="178" height="422" rx="35"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="19" y="87" width="4" height="19" rx="2" fill="#879183"/>
    <rect x="19" y="123" width="4" height="33" rx="2" fill="#879183"/>
    <rect x="19" y="168" width="4" height="33" rx="2" fill="#879183"/>
    <rect x="217" y="143" width="4" height="55" rx="2" fill="#879183"/>
    <rect x="23" y="12" width="194" height="448" rx="44" fill="url(#frame)"/>
    <rect x="26" y="15" width="188" height="442" rx="41" fill="#1d2521" stroke="#566252"/>
    <g clip-path="url(#screen)">
      <rect x="31" y="25" width="178" height="422" fill="url(#glass)"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        <text x="47" y="46" fill="#27382e" font-size="9" font-weight="650">9:41</text>
        <path d="M169 41v3m4-5v5m4-7v7" stroke="#27382e" stroke-width="2" stroke-linecap="round"/>
        <rect x="184" y="37" width="12" height="7" rx="2" stroke="#27382e" stroke-width="1"/>
        <path d="M198 39v3" stroke="#27382e" stroke-width="1.2"/>
        <rect x="186" y="39" width="8" height="3" rx=".7" fill="#27382e"/>
        <rect x="92" y="33" width="56" height="17" rx="8.5" fill="#18201c"/>
        <circle cx="139" cy="41.5" r="2.5" fill="#293735"/>
        <circle cx="139" cy="41.5" r="1" fill="#40565b"/>
        <path d="m47 79-4 4 4 4" stroke="#507861" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="53" y="87" fill="#507861" font-size="11">Settings</text>
        <text x="43" y="122" fill="#233a2d" font-size="20" font-weight="700" letter-spacing="-.6">Restrictions</text>
        <text x="44" y="145" fill="#73806e" font-size="8.5" letter-spacing=".6">DEVICE FEATURES</text>
        <rect x="41" y="155" width="158" height="144" rx="11" fill="#fff"/>
        <path d="M53 203h146M53 251h146" stroke="#e1e6dd" stroke-width=".8"/>
        <text x="53" y="183" fill="#2c3c32" font-size="11">Camera</text>
        <text x="53" y="231" fill="#2c3c32" font-size="11">AirDrop</text>
        <text x="53" y="279" fill="#2c3c32" font-size="10.5">In-app purchases</text>
        <rect x="164" y="171" width="27" height="16" rx="8" fill="#507e59"/>
        <circle cx="183" cy="179" r="6" fill="#fff"/>
        <rect x="164" y="219" width="27" height="16" rx="8" fill="#cbd1c8"/>
        <circle cx="172" cy="227" r="6" fill="#fff"/>
        <rect x="164" y="267" width="27" height="16" rx="8" fill="#cbd1c8"/>
        <circle cx="172" cy="275" r="6" fill="#fff"/>
        <text x="120" y="320" text-anchor="middle" fill="#788371" font-size="8.5">Configuration profile</text>
        <text x="120" y="335" text-anchor="middle" fill="#526b55" font-size="9.5">Configured from your Mac</text>
